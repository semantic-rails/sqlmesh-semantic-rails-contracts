name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: Build and verify exact release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
      - name: Verify release and approved engine identities
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python scripts/verify_release_metadata.py
          --tag "$RELEASE_TAG"
          --verify-adapter-tag
          --verify-engine-tag
          --github-env "$GITHUB_ENV"
      - name: Require release commit on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${ADAPTER_SOURCE_SHA}" refs/remotes/origin/main; then
            echo "Release commit ${ADAPTER_SOURCE_SHA} is not reachable from origin/main." >&2
            exit 1
          fi
      - name: Build wheel and sdist once
        run: uv build --out-dir dist
      - name: Install the exact candidate artifacts
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --upgrade pip
          mkdir -p dependency-artifacts
          .release-venv/bin/python -m pip download \
            --only-binary=:all: \
            --no-deps \
            "semantic-rails==${ENGINE_VERSION}" \
            --dest dependency-artifacts
          .release-venv/bin/python -m pip install \
            dist/*.whl \
            dependency-artifacts/*.whl \
            "sqlmesh==${SQLMESH_RELEASE_TEST_VERSION}" \
            "pytest>=8.0" \
            "ruff>=0.6" \
            "jsonschema>=4.26" \
            "twine>=5.1"
      - name: Test the exact wheel
        env:
          USE_ACTIVE_ENV: "true"
          EXPORT_TESTS: "true"
          SKIP_PACKAGE_BUILD: "true"
        run: |
          export PATH="${GITHUB_WORKSPACE}/.release-venv/bin:${PATH}"
          ./scripts/run_integration_tests.sh
          python -m twine check dist/*
      - name: Generate checksums and provenance
        run: >-
          .release-venv/bin/python scripts/generate_release_provenance.py
          --dist-dir dist
          --engine-wheel-dir dependency-artifacts
          --output release/release-provenance.json
          --git-sha "$ADAPTER_SOURCE_SHA"
          --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-metadata
          path: |
            release/*
            schemas/*.json
            compatibility.json
          if-no-files-found: error

  publish:
    name: Publish verified artifacts
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/

  verify-pypi:
    name: Verify PyPI exact bytes
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist
      - name: Compare published hashes with the built artifacts
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: >-
          python scripts/verify_published_artifacts.py
          --dist-dir dist
          --package sqlmesh-semantic-rails-contracts
          --version "${RELEASE_VERSION#v}"

  release:
    name: Create GitHub Release
    needs: verify-pypi
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-metadata
          path: .
      - name: Verify checksums before release
        run: cd dist && sha256sum -c ../release/SHA256SUMS
      - name: Attach the published artifacts and contracts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*
          release/*
          schemas/*.json
          compatibility.json
          --verify-tag
          --generate-notes
          --title "SQLMesh Semantic Rails Contracts $GITHUB_REF_NAME"
