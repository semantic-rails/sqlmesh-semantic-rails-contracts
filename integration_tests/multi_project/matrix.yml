version: 1

defaults:
  gateway: duckdb

projects:
  - name: customers_project
    project_dir: ../basic
    contract_file: semantic_rails_contract.yml

  - name: orders_project
    project_dir: ../basic
    contract:
      contract_format_version: 1
      semantic:
        producer: {name: semantic-rails, version: 0.2.0}
        packages:
          - package_id: semantic_fixture
            package_schema_version: 1
            semantic_hash: sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
            resources:
              - semantic_model_id: orders
                columns:
                  - name: order_id
                    required_by: [entity.order]
      binding:
        kind: sqlmesh
        binding_version: 1
        packages:
          - package_id: semantic_fixture
            resources:
              - semantic_model_id: orders
                sqlmesh_model: semantic_rails.orders
