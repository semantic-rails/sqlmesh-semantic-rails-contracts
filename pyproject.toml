[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sqlmesh-semantic-rails-contracts"
version = "0.1.0"
description = "SQLMesh contract checks for Semantic Rails packages"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Semantic Rails" }
]
keywords = ["semantic-rails", "sqlmesh", "contracts", "data-contracts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = [
  "PyYAML>=6.0",
  "sqlmesh>=0.235,<1.0"
]

[project.urls]
Homepage = "https://github.com/semantic-rails/sqlmesh-semantic-rails-contracts"
Repository = "https://github.com/semantic-rails/sqlmesh-semantic-rails-contracts"
Issues = "https://github.com/semantic-rails/sqlmesh-semantic-rails-contracts/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[project.scripts]
semantic-rails-sqlmesh-contracts = "sqlmesh_semantic_rails_contracts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_rails_contracts_core", "src/sqlmesh_semantic_rails_contracts"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
